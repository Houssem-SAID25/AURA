name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PortAudio (for PyAudio)
        run: |
          pip install pipwin
          pipwin install pyaudio

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller and Pillow
        run: pip install pyinstaller pillow

      - name: Generate app icon
        run: python assets/make_icon.py

      - name: Build EXE with PyInstaller
        run: pyinstaller aura.spec

      - name: Package distribution folder
        run: Compress-Archive -Path dist/AURA/* -DestinationPath AURA-Windows.zip
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows
          path: AURA-Windows.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AURA-Windows.zip
          body: |
            ## AURA – AI Voice Assistant for Gamers

            ### Installation
            1. Download and extract **AURA-Windows.zip**
            2. Edit `AURA/config.json` with your OBS / Twitch credentials and game paths
            3. Run **AURA.exe**

            No Python installation required.
